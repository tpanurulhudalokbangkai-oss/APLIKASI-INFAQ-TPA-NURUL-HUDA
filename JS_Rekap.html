<style>
  /* Tahap 7: gaya rekap */
  .th-urut { background: none; border: 0; color: inherit; font: inherit; font-weight: 600; cursor: pointer; padding: 0; white-space: nowrap; }
  .th-urut:hover { text-decoration: underline; }
  .tabel tfoot td { font-weight: 700; background: #F3F7F5; border-top: 2px solid var(--hijau-tua); }
  .filter-item label { margin: 0 0 4px; font-size: 12px; color: var(--abu); font-weight: 600; }
  .filter-centang { display: flex; align-items: center; gap: 8px; min-height: 48px; margin: 18px 0 0; font-weight: 600; color: var(--hijau-tua); }
  .filter-centang input { width: 20px; height: 20px; }
  .daftar-aturan { margin: 8px 0 0; padding-left: 20px; font-size: 13px; color: var(--abu); }
  .daftar-aturan li { margin-bottom: 4px; }
  .teks-bulan { min-width: 220px; }
  .lencana-kecil { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: #ECEFED; color: var(--abu); font-size: 11px; font-weight: 700; }
</style>

<script>
  /* =========================================================
     JS_Rekap.html - Tahap 7
     Halaman Rekap Pembayaran dan Rekap Tunggakan,
     serta dialog Nonaktifkan Santri dengan tanggal berhenti.
     ========================================================= */

  /* =================== PEMBANTU =================== */
  function buatFilter(label, kontrol) {
    var wadah = el('div', 'filter-item');
    var lb = el('label', null, label);
    if (kontrol.id) { lb.setAttribute('for', kontrol.id); }
    wadah.appendChild(lb);
    wadah.appendChild(kontrol);
    return wadah;
  }

  /* Mengurutkan salinan daftar berdasarkan kunci urut dan arah. */
  function urutkanDaftar(daftar, urut, pengambil) {
    if (!urut.kunci || !pengambil[urut.kunci]) { return daftar; }
    var arah = urut.arah === 'desc' ? -1 : 1;
    return daftar.slice().sort(function (a, b) {
      var x = pengambil[urut.kunci](a);
      var y = pengambil[urut.kunci](b);
      var hasil;
      if (typeof x === 'number' && typeof y === 'number') { hasil = x - y; }
      else { hasil = String(x).localeCompare(String(y), 'id', { numeric: true }); }
      return hasil * arah;
    });
  }

  /*
   * Tabel dengan judul kolom yang bisa diklik untuk mengurutkan.
   * kolom: [{ judul, kunci (boleh kosong), angka (true/false), isi: function (baris, nomor) }]
   */
  function buatTabelUrut(kolom, daftar, urut, onUrut) {
    var gulir = el('div', 'tabel-gulir');
    var tabel = el('table', 'tabel lebar');

    var kepala = el('thead');
    var barisKepala = el('tr');
    kolom.forEach(function (k) {
      var th = el('th', k.angka ? 'angka' : null);
      if (k.kunci) {
        var tanda = urut.kunci === k.kunci ? (urut.arah === 'desc' ? ' \u25BC' : ' \u25B2') : '';
        var tombol = el('button', 'th-urut', k.judul + tanda);
        tombol.type = 'button';
        tombol.setAttribute('aria-label', 'Urutkan menurut ' + k.judul);
        tombol.addEventListener('click', function () {
          if (urut.kunci === k.kunci) { urut.arah = urut.arah === 'asc' ? 'desc' : 'asc'; }
          else { urut.kunci = k.kunci; urut.arah = 'asc'; }
          onUrut();
        });
        th.appendChild(tombol);
      } else {
        th.textContent = k.judul;
      }
      barisKepala.appendChild(th);
    });
    kepala.appendChild(barisKepala);
    tabel.appendChild(kepala);

    var badan = el('tbody');
    daftar.forEach(function (baris, nomor) {
      var tr = el('tr');
      kolom.forEach(function (k) {
        var td = el('td', k.angka ? 'angka' : null);
        var isi = k.isi(baris, nomor);
        if (isi && isi.nodeType) { td.appendChild(isi); }
        else { td.textContent = (isi === null || isi === undefined) ? '' : String(isi); }
        tr.appendChild(td);
      });
      badan.appendChild(tr);
    });
    tabel.appendChild(badan);
    gulir.appendChild(tabel);
    return gulir;
  }

  /* Menambah baris TOTAL di bawah tabel. */
  function tambahBarisTotal(gulir, jumlahKolom, labelTotal, teksTotal, kolomLabel) {
    var tfoot = el('tfoot');
    var tr = el('tr');
    var tdLabel = el('td', null, labelTotal);
    tdLabel.colSpan = kolomLabel;
    tr.appendChild(tdLabel);
    var tdNilai = el('td', 'angka', teksTotal);
    tr.appendChild(tdNilai);
    var sisa = jumlahKolom - kolomLabel - 1;
    if (sisa > 0) {
      var tdSisa = el('td', null, '');
      tdSisa.colSpan = sisa;
      tr.appendChild(tdSisa);
    }
    tfoot.appendChild(tr);
    gulir.querySelector('table').appendChild(tfoot);
  }

  /* =================== REKAP PEMBAYARAN =================== */
  var DATA_REKAP = { baris: [], total: 0, tahunTersedia: [], kelompok: [], siap: false };
  var FILTER_REKAP = { tahun: 0, bulan: 0, idKelompok: '', kata: '' };
  var URUT_REKAP = { kunci: null, arah: 'asc' };

  var PENGAMBIL_REKAP = {
    nis: function (r) { return r.nis; },
    nama: function (r) { return r.nama; },
    kelompok: function (r) { return r.namaKelompok; },
    bulan: function (r) { return r.bulan; },
    tahun: function (r) { return r.tahun; },
    tanggal: function (r) { return r.tanggal; },
    nominal: function (r) { return r.nominal; },
    penerima: function (r) { return r.penerima; }
  };

  function renderRekap(item) {
    var admin = STATE.pengguna.role === 'ADMIN';
    var tahunIni = new Date().getFullYear();
    FILTER_REKAP = { tahun: tahunIni, bulan: 0, idKelompok: '', kata: '' };
    URUT_REKAP = { kunci: null, arah: 'asc' };
    DATA_REKAP = { baris: [], total: 0, tahunTersedia: [], kelompok: [], siap: false };

    buatKepala(item.label, null, null);

    var bar = el('div', 'toolbar');

    var pilTahun = buatSelect('rekapTahun', [{ nilai: String(tahunIni), label: 'Tahun ' + tahunIni }], String(tahunIni));
    pilTahun.addEventListener('change', function () { FILTER_REKAP.tahun = Number(pilTahun.value); muatRekap(); });

    var opsiBulan = [{ nilai: '0', label: 'Semua bulan' }];
    NAMA_BULAN.forEach(function (n, i) { opsiBulan.push({ nilai: String(i + 1), label: n }); });
    var pilBulan = buatSelect('rekapBulan', opsiBulan, '0');
    pilBulan.addEventListener('change', function () { FILTER_REKAP.bulan = Number(pilBulan.value); muatRekap(); });

    var pilKel = buatSelect('rekapKelompok', [{ nilai: '', label: 'Semua kelompok' }], '');
    pilKel.addEventListener('change', function () { FILTER_REKAP.idKelompok = pilKel.value; muatRekap(); });

    var cari = buatInput('rekapCari', 'text', '', 60);
    cari.placeholder = 'Cari nama santri atau NIS...';
    cari.addEventListener('input', function () { FILTER_REKAP.kata = cari.value; gambarRekap(); });

    bar.appendChild(buatFilter('Tahun', pilTahun));
    bar.appendChild(buatFilter('Bulan', pilBulan));
    if (admin) { bar.appendChild(buatFilter('Kelompok', pilKel)); }
    bar.appendChild(buatFilter('Cari', cari));
    $('isiHalaman').appendChild(bar);

    siapkanWadah();
    muatRekap();
  }

  function muatRekap() {
    var wadah = $('wadahHalaman');
    if (!wadah) { return; }
    var nomor = ++STATE.nomorPermintaan;
    DATA_REKAP.siap = false;
    tampilkanMemuat(wadah);

    panggilServer('ambilRekapPembayaran', [{ tahun: FILTER_REKAP.tahun, bulan: FILTER_REKAP.bulan, idKelompok: FILTER_REKAP.idKelompok }], function (res) {
      if (nomor !== STATE.nomorPermintaan || STATE.halaman !== 'rekap') { return; }
      DATA_REKAP = res.data;
      DATA_REKAP.siap = true;
      isiFilterRekap();
      gambarRekap();
    }, function (pesan) {
      if (nomor !== STATE.nomorPermintaan || STATE.halaman !== 'rekap') { return; }
      tampilkanGalatHalaman(wadah, pesan, muatRekap);
    });
  }

  function isiFilterRekap() {
    var pilTahun = $('rekapTahun');
    pilTahun.innerHTML = '';
    var semua = el('option', null, 'Semua tahun');
    semua.value = '0';
    pilTahun.appendChild(semua);
    DATA_REKAP.tahunTersedia.forEach(function (t) {
      var op = el('option', null, String(t));
      op.value = String(t);
      pilTahun.appendChild(op);
    });
    pilTahun.value = String(FILTER_REKAP.tahun);

    var pilKel = $('rekapKelompok');
    if (pilKel) {
      pilKel.innerHTML = '';
      var semuaKel = el('option', null, 'Semua kelompok');
      semuaKel.value = '';
      pilKel.appendChild(semuaKel);
      DATA_REKAP.kelompok.forEach(function (k) {
        var op = el('option', null, k.nama);
        op.value = k.id;
        pilKel.appendChild(op);
      });
      pilKel.value = FILTER_REKAP.idKelompok;
    }
  }

  function gambarRekap() {
    var wadah = $('wadahHalaman');
    if (!wadah || !DATA_REKAP.siap) { return; }

    var kata = FILTER_REKAP.kata.trim().toLowerCase();
    var daftar = DATA_REKAP.baris.filter(function (r) {
      return !kata || (r.nama + ' ' + r.nis).toLowerCase().indexOf(kata) >= 0;
    });
    var total = 0;
    daftar.forEach(function (r) { total += r.nominal; });

    $('subHalaman').textContent = daftar.length + ' pembayaran sah \u2022 Total: ' + formatRupiah(total);

    wadah.innerHTML = '';
    var panel = el('div', 'panel');
    if (!daftar.length) {
      panel.appendChild(el('div', 'kosong', DATA_REKAP.baris.length
        ? 'Tidak ada data yang cocok dengan pencarian.'
        : 'Belum ada pembayaran sah untuk filter ini.'));
    } else {
      var kolom = [
        { judul: 'No', isi: function (r, i) { return i + 1; } },
        { judul: 'NIS', kunci: 'nis', isi: function (r) { return r.nis; } },
        { judul: 'Nama Santri', kunci: 'nama', isi: function (r) { return r.nama; } },
        { judul: 'Kelompok', kunci: 'kelompok', isi: function (r) { return r.namaKelompok; } },
        { judul: 'Bulan', kunci: 'bulan', isi: function (r) { return NAMA_BULAN[r.bulan - 1]; } },
        { judul: 'Tahun', kunci: 'tahun', isi: function (r) { return r.tahun; } },
        { judul: 'Tanggal Bayar', kunci: 'tanggal', isi: function (r) { return tampilTanggal(r.tanggal); } },
        { judul: 'Nominal', kunci: 'nominal', angka: true, isi: function (r) { return formatRupiah(r.nominal); } },
        { judul: 'Penerima', kunci: 'penerima', isi: function (r) { return r.penerima; } }
      ];
      var terurut = urutkanDaftar(daftar, URUT_REKAP, PENGAMBIL_REKAP);
      var tabel = buatTabelUrut(kolom, terurut, URUT_REKAP, gambarRekap);
      tambahBarisTotal(tabel, kolom.length, 'TOTAL PENERIMAAN', formatRupiah(total), 7);
      panel.appendChild(tabel);
    }
    wadah.appendChild(panel);
  }

  HALAMAN.rekap = renderRekap;

  /* =================== REKAP TUNGGAKAN =================== */
  var DATA_TUNGGAKAN = { baris: [], awalPenagihan: null, akhirHitung: null, tanpaNominal: false, tanpaTanggalBerhenti: 0, kelompok: [], siap: false };
  var FILTER_TUNGGAKAN = { bulan: 0, tahun: 0, idKelompok: '', status: 'SEMUA', hanyaMenunggak: true, kata: '' };
  var URUT_TUNGGAKAN = { kunci: null, arah: 'asc' };

  var PENGAMBIL_TUNGGAKAN = {
    nis: function (r) { return r.nis; },
    nama: function (r) { return r.nama; },
    kelompok: function (r) { return r.namaKelompok; },
    jumlah: function (r) { return r.jumlah; },
    total: function (r) { return r.total; }
  };

  /* Meringkas daftar bulan: "Maret, April 2026; Januari 2027" */
  function ringkasBulan(daftar) {
    if (!daftar.length) { return 'Lunas'; }
    var perTahun = {};
    var urutan = [];
    daftar.forEach(function (b) {
      if (!perTahun[b.tahun]) { perTahun[b.tahun] = []; urutan.push(b.tahun); }
      perTahun[b.tahun].push(NAMA_BULAN[b.bulan - 1]);
    });
    return urutan.map(function (t) { return perTahun[t].join(', ') + ' ' + t; }).join('; ');
  }

  function renderTunggakan(item) {
    var admin = STATE.pengguna.role === 'ADMIN';
    var sekarang = new Date();
    var tahunIni = sekarang.getFullYear();
    var bulanIni = sekarang.getMonth() + 1;
    FILTER_TUNGGAKAN = { bulan: bulanIni, tahun: tahunIni, idKelompok: '', status: 'SEMUA', hanyaMenunggak: true, kata: '' };
    URUT_TUNGGAKAN = { kunci: null, arah: 'asc' };
    DATA_TUNGGAKAN = { baris: [], awalPenagihan: null, akhirHitung: null, tanpaNominal: false, tanpaTanggalBerhenti: 0, kelompok: [], siap: false };

    buatKepala(item.label, null, null);

    var bar = el('div', 'toolbar');

    var opsiBulan = [];
    NAMA_BULAN.forEach(function (n, i) { opsiBulan.push({ nilai: String(i + 1), label: n }); });
    var pilBulan = buatSelect('tgBulan', opsiBulan, String(bulanIni));
    pilBulan.addEventListener('change', function () { FILTER_TUNGGAKAN.bulan = Number(pilBulan.value); muatTunggakan(); });

    var pilTahun = buatSelect('tgTahun', opsiTahun(tahunIni - 3, tahunIni + 1), String(tahunIni));
    pilTahun.addEventListener('change', function () { FILTER_TUNGGAKAN.tahun = Number(pilTahun.value); muatTunggakan(); });

    var pilKel = buatSelect('tgKelompok', [{ nilai: '', label: 'Semua kelompok' }], '');
    pilKel.addEventListener('change', function () { FILTER_TUNGGAKAN.idKelompok = pilKel.value; muatTunggakan(); });

    var pilStatus = buatSelect('tgStatus', [
      { nilai: 'SEMUA', label: 'Semua santri' },
      { nilai: 'AKTIF', label: 'Santri aktif' },
      { nilai: 'NONAKTIF', label: 'Santri nonaktif' }
    ], 'SEMUA');
    pilStatus.addEventListener('change', function () { FILTER_TUNGGAKAN.status = pilStatus.value; muatTunggakan(); });

    var cek = el('input');
    cek.type = 'checkbox';
    cek.id = 'tgHanya';
    cek.checked = true;
    cek.addEventListener('change', function () { FILTER_TUNGGAKAN.hanyaMenunggak = cek.checked; muatTunggakan(); });
    var labelCek = el('label', 'filter-centang');
    labelCek.appendChild(cek);
    labelCek.appendChild(document.createTextNode(' Hanya yang menunggak'));

    var cari = buatInput('tgCari', 'text', '', 60);
    cari.placeholder = 'Cari nama santri atau NIS...';
    cari.addEventListener('input', function () { FILTER_TUNGGAKAN.kata = cari.value; gambarTunggakan(); });

    bar.appendChild(buatFilter('Dihitung sampai bulan', pilBulan));
    bar.appendChild(buatFilter('Tahun', pilTahun));
    if (admin) { bar.appendChild(buatFilter('Kelompok', pilKel)); }
    bar.appendChild(buatFilter('Status santri', pilStatus));
    bar.appendChild(labelCek);
    bar.appendChild(buatFilter('Cari', cari));
    $('isiHalaman').appendChild(bar);

    siapkanWadah();
    muatTunggakan();
  }

  function muatTunggakan() {
    var wadah = $('wadahHalaman');
    if (!wadah) { return; }
    var nomor = ++STATE.nomorPermintaan;
    DATA_TUNGGAKAN.siap = false;
    tampilkanMemuat(wadah);

    var f = FILTER_TUNGGAKAN;
    var kirim = { bulan: f.bulan, tahun: f.tahun, idKelompok: f.idKelompok, status: f.status, hanyaMenunggak: f.hanyaMenunggak };

    panggilServer('ambilRekapTunggakan', [kirim], function (res) {
      if (nomor !== STATE.nomorPermintaan || STATE.halaman !== 'tunggakan') { return; }
      DATA_TUNGGAKAN = res.data;
      DATA_TUNGGAKAN.siap = true;

      var pilKel = $('tgKelompok');
      if (pilKel) {
        pilKel.innerHTML = '';
        var semuaKel = el('option', null, 'Semua kelompok');
        semuaKel.value = '';
        pilKel.appendChild(semuaKel);
        DATA_TUNGGAKAN.kelompok.forEach(function (k) {
          var op = el('option', null, k.nama);
          op.value = k.id;
          pilKel.appendChild(op);
        });
        pilKel.value = FILTER_TUNGGAKAN.idKelompok;
      }
      gambarTunggakan();
    }, function (pesan) {
      if (nomor !== STATE.nomorPermintaan || STATE.halaman !== 'tunggakan') { return; }
      tampilkanGalatHalaman(wadah, pesan, muatTunggakan);
    });
  }

  function gambarTunggakan() {
    var wadah = $('wadahHalaman');
    var d = DATA_TUNGGAKAN;
    if (!wadah || !d.siap) { return; }
    var admin = STATE.pengguna.role === 'ADMIN';

    wadah.innerHTML = '';
    $('subHalaman').textContent = 'Dihitung sampai ' + NAMA_BULAN[FILTER_TUNGGAKAN.bulan - 1] + ' ' + FILTER_TUNGGAKAN.tahun;

    if (d.tanpaNominal) {
      wadah.appendChild(el('div', 'pesan info', 'Nominal infaq belum diatur, sehingga tunggakan belum dapat dihitung. ' +
        (admin ? 'Atur nominal di menu Pengaturan.' : 'Hubungi Admin.')));
      return;
    }
    if (d.awalPenagihan) {
      wadah.appendChild(el('div', 'pesan info', 'Penagihan dimulai dari periode nominal paling awal: ' +
        NAMA_BULAN[d.awalPenagihan.bulan - 1] + ' ' + d.awalPenagihan.tahun + '. Bulan sebelumnya tidak ditagih.'));
    }
    if (d.tanpaTanggalBerhenti > 0) {
      wadah.appendChild(el('div', 'pesan galat', d.tanpaTanggalBerhenti +
        ' santri nonaktif tidak dihitung karena tanggal berhentinya tidak tercatat. Aktifkan lalu nonaktifkan kembali dengan tanggal berhenti.'));
    }

    var kata = FILTER_TUNGGAKAN.kata.trim().toLowerCase();
    var daftar = d.baris.filter(function (r) {
      return !kata || (r.nama + ' ' + r.nis).toLowerCase().indexOf(kata) >= 0;
    });

    var jumlahMenunggak = 0;
    var totalBulan = 0;
    var totalRupiah = 0;
    daftar.forEach(function (r) {
      if (r.jumlah > 0) { jumlahMenunggak++; }
      totalBulan += r.jumlah;
      totalRupiah += r.total;
    });

    var grid = el('div', 'grid-stat');
    grid.appendChild(buatKartuStat('peringatan', 'merah', 'Santri Menunggak', jumlahMenunggak, 'dari ' + daftar.length + ' santri ditampilkan'));
    grid.appendChild(buatKartuStat('uang', 'emas', 'Total Tunggakan', formatRupiah(totalRupiah), 'sampai ' + NAMA_BULAN[FILTER_TUNGGAKAN.bulan - 1] + ' ' + FILTER_TUNGGAKAN.tahun));
    grid.appendChild(buatKartuStat('kalender', '', 'Total Bulan Tertunggak', totalBulan, 'jumlah seluruh santri'));
    wadah.appendChild(grid);

    var panel = el('div', 'panel');
    if (!daftar.length) {
      panel.appendChild(el('div', 'kosong', d.baris.length
        ? 'Tidak ada data yang cocok dengan pencarian.'
        : 'Tidak ada santri yang menunggak untuk filter ini.'));
    } else {
      var kolom = [
        { judul: 'No', isi: function (r, i) { return i + 1; } },
        { judul: 'NIS', kunci: 'nis', isi: function (r) { return r.nis; } },
        {
          judul: 'Nama Santri', kunci: 'nama',
          isi: function (r) {
            var sel = el('span', null, r.nama);
            if (!r.aktif) { sel.appendChild(el('span', 'lencana-kecil', 'Nonaktif')); }
            return sel;
          }
        },
        { judul: 'Kelompok', kunci: 'kelompok', isi: function (r) { return r.namaKelompok; } },
        { judul: 'Bulan Belum Dibayar', isi: function (r) { return ringkasBulan(r.bulanTertunggak); } },
        { judul: 'Jumlah Bulan', kunci: 'jumlah', angka: true, isi: function (r) { return r.jumlah; } },
        { judul: 'Total Tunggakan', kunci: 'total', angka: true, isi: function (r) { return formatRupiah(r.total); } }
      ];
      var terurut = urutkanDaftar(daftar, URUT_TUNGGAKAN, PENGAMBIL_TUNGGAKAN);
      var tabel = buatTabelUrut(kolom, terurut, URUT_TUNGGAKAN, gambarTunggakan);
      var tfoot = el('tfoot');
      var tr = el('tr');
      var tdLabel = el('td', null, 'TOTAL');
      tdLabel.colSpan = 5;
      tr.appendChild(tdLabel);
      tr.appendChild(el('td', 'angka', String(totalBulan)));
      tr.appendChild(el('td', 'angka', formatRupiah(totalRupiah)));
      tfoot.appendChild(tr);
      tabel.querySelector('table').appendChild(tfoot);
      panel.appendChild(tabel);
    }
    wadah.appendChild(panel);

    var panelAturan = el('div', 'panel');
    panelAturan.appendChild(el('h3', 'panel-judul', 'Cara Perhitungan'));
    var daftarAturan = el('ul', 'daftar-aturan');
    [
      'Bulan masuk santri ikut ditagih, bulan sebelum tanggal masuk tidak dihitung.',
      'Santri nonaktif dihitung sampai bulan tanggal berhenti, bulan sesudahnya tidak dihitung.',
      'Bulan yang dibebaskan (sheet PEMBEBASAN) tidak dihitung.',
      'Nominal tiap bulan mengikuti nominal yang berlaku pada bulan itu.',
      'Bulan dianggap lunas jika ada pembayaran sah, berapa pun nominalnya. Transaksi yang dibatalkan tidak dianggap pembayaran.'
    ].forEach(function (teks) { daftarAturan.appendChild(el('li', null, teks)); });
    panelAturan.appendChild(daftarAturan);
    wadah.appendChild(panelAturan);
  }

  HALAMAN.tunggakan = renderTunggakan;

  /* =================== NONAKTIFKAN SANTRI DENGAN TANGGAL BERHENTI =================== */
  /* Menimpa aksiSantri dari JS_Master.html agar penonaktifan meminta tanggal berhenti. */
  aksiSantri = function (s) {
    var wadah = el('div', 'aksi');
    wadah.appendChild(tombolAksi('Detail', function () { bukaDetailSantri(s); }));
    wadah.appendChild(tombolAksi('Edit', function () { bukaFormSantri(s); }));

    if (s.aktif) {
      wadah.appendChild(tombolAksi('Nonaktifkan', function () { bukaNonaktifSantri(s); }, true));
    } else {
      wadah.appendChild(tombolAksi('Aktifkan', function () {
        konfirmasi(
          'Aktifkan Santri',
          'Aktifkan kembali "' + s.nama + '"? Tanggal berhenti dihapus. Jika santri sempat berhenti beberapa bulan, ' +
            'bulan-bulan itu akan terhitung sebagai tunggakan kecuali dibebaskan di sheet PEMBEBASAN.',
          'Ya, Aktifkan', false,
          function (h) { simpanDanTutup(h, 'ubahStatusSantri', [s.idSantri, true, ''], muatSantri); }
        );
      }));
    }
    return wadah;
  };

  function bukaNonaktifSantri(s) {
    var form = el('div');
    form.appendChild(el('p', null, 'Nonaktifkan "' + s.nama + '"? Data dan riwayat pembayaran tetap tersimpan.'));
    var fTanggal = buatInput('fTanggalBerhenti', 'date', hariIniIso());
    form.appendChild(buatField('Tanggal Berhenti', fTanggal,
      'Bulan pada tanggal ini masih ditagih. Bulan sesudahnya tidak ditagih lagi.'));

    bukaModal('Nonaktifkan Santri', form, [
      { teks: 'Batal', klik: function () { tutupModal(); } },
      {
        teks: 'Ya, Nonaktifkan', kelas: 'tombol-utama bahaya', utama: true,
        klik: function (h) {
          if (!fTanggal.value) { h.tampilPesan('Tanggal berhenti wajib diisi.'); return; }
          h.tampilPesan('');
          h.setSibuk(true);
          simpanDanTutup(h, 'ubahStatusSantri', [s.idSantri, false, fTanggal.value], muatSantri);
        }
      }
    ]);
  }
</script>
