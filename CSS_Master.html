<style>
  /* Tahap 5: form, modal, toolbar, tombol aksi */
  .toast { z-index: 300; }

  .tombol-utama {
    min-height: 44px;
    padding: 0 18px;
    border: 0;
    border-radius: 10px;
    background: var(--hijau-tua);
    color: var(--putih);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .tombol-utama:hover { background: #0E5F48; }
  .tombol-utama.bahaya { background: var(--merah); }
  .tombol-utama.bahaya:hover { background: #8F1E18; }
  .tombol-utama:disabled, .tombol-sekunder:disabled, .tombol-aksi:disabled { opacity: 0.6; cursor: wait; }

  .tombol-aksi {
    min-height: 38px;
    padding: 0 12px;
    border: 1px solid var(--garis);
    border-radius: 8px;
    background: var(--putih);
    color: var(--hijau-tua);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .tombol-aksi:hover { background: var(--hijau-muda); }
  .tombol-aksi.bahaya { color: var(--merah); border-color: #E7B7B3; }
  .tombol-aksi.bahaya:hover { background: var(--merah-muda); }
  .aksi { display: flex; gap: 6px; flex-wrap: wrap; }

  select, input[type="date"], input[type="tel"] {
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid var(--garis);
    border-radius: 10px;
    background: var(--putih);
    color: var(--teks);
    font-family: inherit;
  }
  input[type="tel"]:focus, input[type="date"]:focus, select:focus {
    outline: 2px solid var(--emas);
    border-color: var(--emas);
  }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .toolbar > * { flex: 1 1 200px; }

  .tabel.lebar { min-width: 920px; }

  .lencana-status {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .lencana-status.aktif { background: var(--hijau-muda); color: var(--hijau-tua); }
  .lencana-status.nonaktif { background: #ECEFED; color: var(--abu); }

  .field { margin-bottom: 4px; }
  .bantuan { font-size: 12px; color: var(--abu); margin-top: 4px; }
  .teks-tetap { padding: 10px 12px; background: #F3F7F5; border-radius: 10px; color: var(--teks); }
  .baris-password { display: flex; gap: 8px; }
  .baris-password input { flex: 1; min-width: 0; }

  .detail { display: grid; grid-template-columns: 150px 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
  .detail dt { color: var(--abu); }
  .detail dd { margin: 0; font-weight: 600; word-break: break-word; }

  .modal-latar {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal {
    width: 100%; max-width: 520px;
    max-height: calc(100vh - 32px);
    display: flex; flex-direction: column;
    background: var(--putih);
    border-radius: 16px;
    border-top: 5px solid var(--emas);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
  }
  .modal-kepala { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 4px 20px; }
  .modal-kepala h3 { margin: 0; font-size: 18px; color: var(--hijau-tua); }
  .tombol-tutup { width: 44px; height: 44px; border: 0; background: transparent; font-size: 28px; line-height: 1; color: var(--abu); cursor: pointer; }
  .modal-badan { padding: 8px 20px 12px; overflow-y: auto; }
  .modal-kaki { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; padding: 10px 20px 18px; }

  @media (max-width: 480px) {
    .detail { grid-template-columns: 1fr; gap: 2px; }
    .detail dd { margin-bottom: 8px; }
    .modal-kaki button { flex: 1; }
  }
</style>
